spring:
  application:
    name: production-service
  datasource:
    url: jdbc:postgresql://localhost:5432/production?useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8081}

client:
  service:
    url: http://localhost:8081
    production:
      endpoint: /api/production/endpoint/produit/v1
    administration:
      endpoint: /api/production/endpoint/administration/v1

kind: Application

security:
  jwt:
    # Cle base64 de 32+ octets pour HS256.
    secret: bXlfc3VwZXJfc2VjcmV0X2tleV9mb3JfcHJvZHVjdGlvbl9zZXJ2aWNlXzIwMjY=
    expiration-ms: 180000
    # Refresh token expiration: 7 jours
    refresh-expiration-ms: 604800000

