spring:
  application:
    name: production-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

client:
  service:
    url: http://localhost:8081
    production:
      endpoint: /api/production/endpoint/produit/v1
    administration:
      endpoint: /api/production/endpoint/administration/v1

kind: Application

security:
  jwt:
    # Cle base64 de 32+ octets pour HS256.
    secret: bXlfc3VwZXJfc2VjcmV0X2tleV9mb3JfcHJvZHVjdGlvbl9zZXJ2aWNlXzIwMjY=
    expiration-ms: 8640000000
    # Refresh token expiration: 7 jours
    refresh-expiration-ms: 604800000

